# Compila la APK de Android en GitHub (no hace falta instalar Android Studio).
# Se ejecuta en cada push que toque el juego y a mano desde la pestaña Actions
# («Run workflow»). La APK queda en:
#   · Actions → la ejecución → Artifacts → IslaRoyale-apk
#   · Releases → «Isla Royale (APK de prueba)» (se descarga directo desde el móvil)
name: APK Android

on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ya trae el SDK de Android (ANDROID_HOME); Gradle
      # descarga solo la plataforma que falte.
      - name: Comprobar el SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Instalar dependencias
        run: npm install

      - name: Compilar el juego y copiarlo al proyecto Android
        # IDs de anuncios y donaciones (opcionales: sin ellos, anuncios de prueba)
        env:
          VITE_ADMOB_REWARDED: ${{ secrets.VITE_ADMOB_REWARDED }}
          VITE_ADMOB_INTERSTITIAL: ${{ secrets.VITE_ADMOB_INTERSTITIAL }}
          VITE_ADMOB_TESTING: ${{ secrets.VITE_ADMOB_TESTING }}
          VITE_DONATE_URL: ${{ secrets.VITE_DONATE_URL }}
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
        run: npm run build:android

      # Firma opcional para la Play Store: añade estos secretos en
      # Settings → Secrets and variables → Actions (ver movil/README.md).
      - name: Preparar firma (si hay secretos)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/isla.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/isla.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then ./gradlew --no-daemon assembleRelease bundleRelease; fi

      - name: Reunir archivos
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk salida/IslaRoyale-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk salida/IslaRoyale.apk
            cp android/app/build/outputs/bundle/release/app-release.aab salida/IslaRoyale.aab
          fi
          ls -la salida

      - uses: actions/upload-artifact@v5
        with:
          name: IslaRoyale-apk
          path: salida/*

      - name: Publicar en Releases
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          NOTES="APK de prueba generada automáticamente desde la rama ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Descárgala en el móvil y ábrela para instalarla (permite «instalar apps de origen desconocido»)."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" salida/* --target "$GITHUB_SHA" --prerelease \
            --title "Isla Royale (APK de prueba · ${GITHUB_REF_NAME})" --notes "$NOTES"
