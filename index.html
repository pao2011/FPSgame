<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Isla Royale</title>
    <meta name="description" content="Battle royale 3D gratis: salta del autobús, saquea, construye y sé el último en pie. Juega contra bots o con tus amigos de PC y móvil." />
    <meta name="theme-color" content="#0b1630" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Isla Royale" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="loading">
      <div class="ld-art"></div>
      <div class="ld-front">
        <div class="logo">ISLA<span>ROYALE</span></div>
        <div class="ld-season">TEMPORADA 1 · ISLA TROPICAL</div>
      </div>
      <div class="ld-bottom">
        <div class="loading-tip"></div>
        <div class="ld-row"><span class="loading-text">Generando la isla…</span><span class="ld-pct">0%</span></div>
        <div class="bar"><div></div></div>
      </div>
    </div>

    <!-- Mira telescópica: debajo del HUD y de los botones táctiles -->
    <div id="scope">
      <div class="lens"></div>
      <div class="h"></div>
      <div class="v"></div>
    </div>

    <!-- HUD -->
    <div id="hud" style="display: none">
      <div id="damage-numbers"></div>
      <div id="storm-vignette"></div>
      <div id="damage-vignette"></div>
      <div id="damage-dir"></div>
      <div id="kill-feed"></div>
      <div id="name-tags"></div>
      <div id="team-panel"></div>
      <div id="score-bar"></div>
      <div id="speedo"></div>

      <div id="crosshair">
        <i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i><i class="dot"></i>
      </div>
      <div id="hitmarker"><i></i><i></i><i></i><i></i></div>

      <div id="compass">
        <div id="compass-strip"></div>
        <div id="compass-marks"></div>
        <div class="needle"></div>
        <div id="heading"></div>
      </div>

      <div id="top-right">
        <canvas id="minimap" width="200" height="200"></canvas>
        <div id="stats"></div>
        <div id="storm-info"></div>
      </div>

      <div id="banner"></div>
      <div id="zone-name"></div>
      <div id="altitude"></div>
      <div id="prompt"></div>
      <div id="edit-hint"></div>
      <div id="toast"></div>

      <div id="progress"><div id="progress-label"></div><div class="track"><div id="progress-fill"></div></div></div>

      <div id="bottom-left">
        <div class="bar-row shield"><div class="icon">⛨</div><div class="bar"><div id="sh-fill"></div></div><div id="sh-val">0</div></div>
        <div class="bar-row health"><div class="icon">✚</div><div class="bar"><div id="hp-fill"></div></div><div id="hp-val">100</div></div>
      </div>

      <div id="bottom-right">
        <div id="mats"></div>
        <div id="weapon-name"></div>
        <div id="ammo"></div>
        <div id="slots"></div>
        <div id="build-bar"></div>
        <div id="ammo-list"></div>
      </div>

      <div id="fullmap">
        <div class="frame">
          <div class="title">MAPA DE LA ISLA <small>(M para cerrar · clic: marcar destino · clic derecho: quitar)</small></div>
          <canvas id="fullmap-canvas" width="640" height="640"></canvas>
        </div>
      </div>
    </div>

    <!-- MENÚS (los rellena src/ui/menu.js) -->
    <div id="main-menu" class="screen" style="display: none"></div>
    <div id="pause" class="screen" style="display: none"></div>
    <div id="end" class="screen" style="display: none"></div>
    <div id="fps" style="display: none"></div>
    <div id="rotate-hint"><div class="phone"></div>Gira el móvil para jugar en horizontal</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
